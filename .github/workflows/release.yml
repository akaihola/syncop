name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APK_NAME: syncop-${{ github.ref_name }}.apk
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SYNCOP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SYNCOP_KEYSTORE_BASE64 secret is missing; see docs/development.md"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SYNCOP_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed release APK
        env:
          SYNCOP_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SYNCOP_KEYSTORE_PASSWORD: ${{ secrets.SYNCOP_KEYSTORE_PASSWORD }}
          SYNCOP_KEY_ALIAS: ${{ secrets.SYNCOP_KEY_ALIAS }}
          SYNCOP_KEY_PASSWORD: ${{ secrets.SYNCOP_KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleRelease

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
